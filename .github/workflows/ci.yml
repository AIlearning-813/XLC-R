# 新励成招聘管理系统 V2.0 — CI
#
# 背景：原 recruit-tracker-v2/.github/workflows/ci-cd.yml 位于项目子目录内，
# 而 GitHub Actions 只读取仓库根目录下的 .github/workflows/，因此从未运行过。
# 本文件在仓库根重建。
#
# 只做「验证」，不做部署：部署由维护者在本地执行（见
# recruit-tracker-v2/docs/安全加固-自定义登录与数据库规则.md），
# 且推送前须先过 scripts/preflight-fn-deploy.cjs 环境变量门禁。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: recruit-tracker-v2

env:
  # 构建期需要环境 ID，否则产物不含环境 ID、前端连不上 CloudBase。
  # 该值不是密钥（.env.development 已提交同一 ID，且它本就烘进公开产物）。
  VITE_CLOUDBASE_ENV_ID: xlc-recruit-d1gmbx8gybc8a3565
  # npm ci 阶段跳过 Playwright 浏览器下载（数百 MB），E2E 任务里单独安装 chromium
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test-and-build:
    name: 单元测试 + 生产构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recruit-tracker-v2/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 单元测试（Vitest）
        run: npm test

      - name: 生产构建（Vite）
        run: npm run build

  e2e:
    name: 端到端测试（Playwright）
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recruit-tracker-v2/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        run: npx playwright test --reporter=list

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            recruit-tracker-v2/e2e/reports/
            recruit-tracker-v2/test-results/
          retention-days: 7
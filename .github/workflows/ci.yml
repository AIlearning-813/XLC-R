# 新励成招聘管理系统 V2.0 — CI（单元测试 + 生产构建）
#
# 背景：原 recruit-tracker-v2/.github/workflows/ci-cd.yml 位于项目子目录内，
# 而 GitHub Actions 只读取仓库根目录下的 .github/workflows/，因此该文件从未运行过；
# 其内部路径（在仓库根执行 npm ci、cd cloud-functions/<fn>）也与实际布局不符。
#
# 本文件接手后重建，只启用「单元测试 + 生产构建」门禁。
# 部署（静态托管 + 云函数）由维护者在本地执行并校验产物哈希，
# 故此处不引用任何 secrets，也不会误触发线上变更。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: recruit-tracker-v2

env:
  # 构建期需要环境 ID，否则产物无法连上 CloudBase。
  # 该值不是密钥（.env.development 已提交同一 ID，且它本就烘进前端公开产物）。
  VITE_CLOUDBASE_ENV_ID: xlc-recruit-d1gmbx8gybc8a3565
  # 单元测试不需要浏览器；跳过 Playwright 浏览器下载，
  # 避免 npm ci 阶段拉取数百 MB 二进制拖慢或拖挂流水线。
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test-and-build:
    name: 单元测试 + 生产构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recruit-tracker-v2/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 单元测试（Vitest）
        run: npm test

      - name: 生产构建（Vite）
        run: npm run build